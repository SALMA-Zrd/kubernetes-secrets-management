apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-api-postgres-ingress
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: native
          podSelector:
            matchLabels:
              app: secrets-api-vault
      ports:
        - protocol: TCP
          port: 5432
