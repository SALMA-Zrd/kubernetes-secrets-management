
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: secrets-lab

networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"

nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /home/salma/secrets-lab/kind/encryption/encryption-config.yaml
        containerPath: /etc/kubernetes/encryption/encryption-config.yaml
        readOnly: true

    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            encryption-provider-config: /etc/kubernetes/encryption/encryption-config.yaml
            feature-gates: MutatingAdmissionPolicy=true
            runtime-config: admissionregistration.k8s.io/v1beta1=true
          extraVolumes:
            - name: encryption-config
              hostPath: /etc/kubernetes/encryption/encryption-config.yaml
              mountPath: /etc/kubernetes/encryption/encryption-config.yaml
              readOnly: true
              pathType: File

  - role: worker
